<style>
:root{--navy:#13233b;--blue:#1769d1;--line:#dbe3ee;--muted:#637186;--bg:#f3f6fa;--danger:#c62828}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172033;font:14px/1.35 -apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{height:56px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:9px;padding:8px max(12px,calc((100% - 1180px)/2));position:sticky;top:0;z-index:20}.brand{font-size:16px;font-weight:900;margin-right:auto}.btn{border:1px solid #cbd5e1;background:#fff;color:#172033;border-radius:8px;padding:8px 11px;font-weight:800}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{color:var(--danger);border-color:#fecaca;background:#fff7f7}.btn.sm{padding:5px 7px;font-size:12px}.shell{max-width:1180px;margin:auto;padding:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}.start{max-width:760px;margin:30px auto}.start h1{font-size:21px;margin:0 0 12px}.trade-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.trade{min-height:88px;text-align:left;border:1px solid var(--line);border-radius:10px;background:#fff;padding:12px;font-weight:900;color:var(--navy)}.trade:active{background:#eaf3ff;border-color:var(--blue)}.trade small{display:block;font-weight:500;color:var(--muted);margin-top:4px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px}.headrow{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:10px}.headrow h2{font-size:16px;margin:0}.customer{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.field label{display:block;font-size:11px;color:var(--muted);font-weight:800;margin:0 0 3px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px;background:#fff}.quantity{display:flex;gap:7px;flex-wrap:wrap}.quantity .field{min-width:150px;flex:1}.qbox{position:relative;overflow:hidden}.qbox b{position:absolute;right:10px;bottom:-15px;font-size:60px;color:#1769d10d;pointer-events:none}.table{width:100%;border-collapse:collapse}.table th{font-size:11px;text-align:left;color:var(--muted);padding:5px;border-bottom:1px solid var(--line)}.table td{padding:5px;border-bottom:1px solid #edf1f5}.table input,.table select{width:100%;border:1px solid var(--line);border-radius:5px;padding:5px}.money{text-align:right;font-weight:800;white-space:nowrap}.card-list{display:none}.item-card{border:1px solid var(--line);border-radius:7px;margin-bottom:3px;overflow:hidden;background:#fff}.item-line{min-height:36px;display:grid;grid-template-columns:minmax(0,1fr) 47px 32px 67px 78px 28px;align-items:center;gap:3px;padding:3px 6px}.item-name{font-weight:850;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-line input{width:100%;border:0;background:transparent;text-align:right;padding:3px;min-width:0}.item-line .unit{text-align:center;font-size:11px}.icon{border:0;background:transparent;color:var(--danger);font-size:19px;padding:2px}.detail{display:none;border-top:1px solid var(--line);padding:8px;background:#fafcff}.item-card.open .detail{display:grid;grid-template-columns:1fr 1fr;gap:7px}.detail .wide{grid-column:1/-1}.summary{display:grid;gap:7px;position:sticky;top:68px}.sumrow{display:flex;justify-content:space-between;border-bottom:1px solid #e7edf4;padding:7px 0}.sumrow.total{font-size:20px;color:var(--blue);border:0}.side-actions{display:grid;gap:7px}.empty{color:var(--muted);padding:18px;text-align:center}.modal-bg{display:none;position:fixed;z-index:100;inset:0;background:#07111a88;padding:14px;align-items:flex-end;justify-content:center}.modal-bg.open{display:flex}.modal{background:#fff;width:min(760px,100%);max-height:90vh;overflow:auto;border-radius:14px;padding:14px}.modal h2{font-size:17px;margin:0 0 10px}.modal-actions{display:flex;gap:7px;justify-content:flex-end;margin-top:12px}.warehouse-card{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:6px}.warehouse-card strong{display:block}.warehouse-card small{color:var(--muted)}.edit-rows{display:grid;gap:5px}.edit-row{display:grid;grid-template-columns:1.4fr 1fr 55px 55px 70px 85px 26px;gap:4px;align-items:center}.edit-row input,.edit-row select{min-width:0;width:100%;border:1px solid var(--line);border-radius:5px;padding:6px}.notice{font-size:12px;color:var(--muted)}.hide{display:none!important}@media(max-width:760px){body{font-size:13px}.top{height:51px;padding:6px 8px}.brand{font-size:14px}.top .btn{padding:7px 8px;font-size:12px}.shell{padding:7px}.panel{padding:10px;margin-bottom:7px;border-radius:8px}.trade-grid{grid-template-columns:1fr 1fr;gap:6px}.trade{min-height:65px;padding:9px;font-size:13px}.trade small{font-size:10px;margin-top:2px}.workspace{display:block}.side{margin-top:7px}.customer{grid-template-columns:1fr 1fr}.customer .field:first-child{grid-column:1/-1}.table{display:none}.card-list{display:block}.summary{position:static}.item-card.open .detail{display:grid}.modal-bg{padding:0;align-items:flex-end}.modal{border-radius:14px 14px 0 0;max-height:92vh}.edit-row{grid-template-columns:1fr 55px 48px 70px 25px}.edit-row .desc,.edit-row .group{display:none}.hide-mobile{display:none}.headrow{margin-bottom:7px}.quantity .field{min-width:calc(50% - 4px)}.side-actions{grid-template-columns:1fr 1fr}.side-actions .btn:last-child{grid-column:1/-1}}
</style><style>.guarantee-choice{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 12px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#f8fbff;font-weight:800}.guarantee-choice span{color:var(--navy)}.guarantee-choice label{display:inline-flex;align-items:center;gap:4px;cursor:pointer}.guarantee-choice input{accent-color:var(--blue)}</style>
</head><body>
<header class="top"><span class="brand">見積ツール <small>CLEAN</small></span><button class="btn" onclick="App.openCases()">案件</button><button class="btn" onclick="App.openWarehouse()">倉庫</button><button class="btn" onclick="App.openSync()">同期</button><button class="btn" onclick="App.newEstimate()">新規</button><button class="btn primary" onclick="App.saveCase()">保存</button><button class="btn" onclick="App.print()">PDF</button></header>
<main class="shell">
 <section id="start" class="panel start"><h1>工事を選ぶ</h1><div id="tradeGrid" class="trade-grid"></div></section>
 <section id="work" class="hide"><div class="workspace"><div>
 <section class="panel"><div class="headrow"><div class="construction-field"><label id="tradeTitle">工事名</label><input data-field="constructionName" aria-label="工事名" placeholder="工事名"></div><button class="btn sm" onclick="App.openCustomer()">顧客を選ぶ・入力</button></div><div class="customer"><div class="field"><label>顧客名</label><input data-field="name"></div><div class="field"><label>電話番号</label><input data-field="phone" type="tel"></div><div class="field"><label>工事場所</label><input data-field="address"></div><div class="field"><label>工事期間</label><input data-field="period" placeholder="例：令和8年9月1日〜9月3日"></div><div class="field"><label>会社名</label><select data-field="company"><option value="">選択なし</option><option value="中央技建">中央技建</option><option value="日建">日建</option><option value="エコロジー">エコロジー</option></select></div><div class="field"><label>担当1</label><select data-field="manager"><option value="">選択なし</option><option value="荒川">荒川</option><option value="上原">上原</option><option value="股部">股部</option></select></div></div></section>
  <section id="quantityPanel" class="panel hide"><div class="headrow"><h2>一括数量</h2></div><div id="quantityBoxes" class="quantity"></div></section>
  <section class="panel"><div class="headrow"><h2>明細</h2><button class="btn sm" onclick="App.openWarehouse()">＋ 倉庫から追加</button></div><div id="empty" class="empty">明細がありません</div><table class="table"><thead><tr><th>品名</th><th>概要</th><th>数量</th><th>単位</th><th>単価</th><th>金額</th><th></th></tr></thead><tbody id="rows"></tbody></table><div id="cards" class="card-list"></div></section>
 </div><aside class="side"><section class="panel summary"><div class="field"><label>諸経費（円）</label><input id="expense" type="number"></div><div class="field"><label>備考</label><textarea id="note" rows="4"></textarea></div><div class="sumrow"><span>工事費</span><b id="workSum">¥0</b></div><div class="sumrow"><span>小計</span><b id="subSum">¥0</b></div><div class="sumrow"><span>消費税</span><b id="taxSum">¥0</b></div><div class="sumrow total"><span>合計</span><b id="grandSum">¥0</b></div><div class="side-actions"><button class="btn" onclick="App.openWarehouse()">＋ 工事・項目</button><button class="btn primary" onclick="App.saveCase()">保存</button><button class="btn" onclick="App.print()">PDF・印刷</button></div></section></aside></div></section>
</main><div id="modalBg" class="modal-bg" onclick="App.backdrop(event)"><div id="modal" class="modal"></div></div>
<script>
const CLEAN_APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbw461TnwHWu6_SCj8uU0zaImdtiT-3u3HNGY1sAyHbqF_514pIj0oTexmcpHjbINoSeoA/exec';
const Store=(()=>{const P='mitsumori.clean.';const read=(k,f)=>{try{const v=JSON.parse(localStorage.getItem(P+k));return v??f}catch(_){return f}};const write=(k,v)=>localStorage.setItem(P+k,JSON.stringify(v));return{read,write,keys:{draft:'draft',masters:'masters',templates:'templates',cases:'cases',settings:'settings'}}})();
const Calc={num:v=>Number(v)||0,yen:v=>'¥'+Math.round(v||0).toLocaleString('ja-JP'),totals:e=>{const work=e.items.reduce((s,x)=>s+Calc.num(x.qty)*Calc.num(x.price),0),expense=Calc.num(e.expense),sub=work+expense,tax=Math.round(sub*.1);return{work,expense,sub,tax,grand:sub+tax}}};
const Catalog=(()=>{const id=p=>p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);const defaults=[
 ['sash_replace','sash','サッシ交換','既存撤去・新規取付',1,'組',120000,'sashCount'],['sash_finish','sash','サッシまわり補修','内外部仕上げ復旧',1,'組',25000,'sashCount'],['sash_disposal','sash','サッシ処分','運搬・処分',1,'組',8000,'sashCount'],
 ['bath_demo','bath','浴室内解体','既存浴室の解体・撤去',1,'組',215000,''],['bath_carpentry','bath','周辺大工工事','下地・周辺補修',1,'組',236000,''],['bath_unit','bath','ユニットバス設置','本体・据付調整',1,'組',589000,''],['bath_plumbing','bath','給排水配管工事','給排水接続',1,'組',140000,''],
 ['conc_base','concrete','砕石敷き・転圧','',0,'㎡',1800,'concreteArea'],['conc_mesh','concrete','ワイヤーメッシュ敷設','',0,'㎡',1200,'concreteArea'],['conc_pour','concrete','土間コンクリート打設','',0,'㎡',8500,'concreteArea'],['conc_form','concrete','型枠工事','',0,'m',2500,''],['conc_dispose','concrete','残土処分','',1,'式',35000,''],
 ['paint_scaffold','paint','足場仮設組','',0,'㎡',1000,'scaffoldArea'],['paint_net','paint','養生ネット張り','',0,'㎡',200,'scaffoldArea'],['paint_wash','paint','高圧洗浄','',0,'㎡',300,'paintArea'],['paint_under','paint','下塗り','',0,'㎡',700,'paintArea'],['paint_middle','paint','中塗り','',0,'㎡',900,'paintArea'],['paint_top','paint','上塗り','',0,'㎡',900,'paintArea'],['paint_barge','paint','破風塗装','',0,'m',1600,''],['paint_parts','paint','付帯部塗装','',1,'式',65000,''],
 ['water_toilet','water','便器・タンク交換','',1,'組',180000,''],['water_connect','water','給排水接続工事','',1,'組',45000,''],['water_remove','water','既存撤去・処分','',1,'組',25000,'']
 ].map(x=>({id:x[0],trade:x[1],name:x[2],desc:x[3],qty:x[4],unit:x[5],price:x[6],group:x[7]}));const templates=[
  {id:'tpl_sash',trade:'sash',name:'サッシ工事',items:['sash_replace','sash_finish','sash_disposal']},{id:'tpl_bath',trade:'bath',name:'ユニットバス工事',items:['bath_demo','bath_carpentry','bath_unit','bath_plumbing']},{id:'tpl_concrete',trade:'concrete',name:'コンクリ打設工事',items:['conc_base','conc_mesh','conc_pour','conc_form','conc_dispose']},{id:'tpl_paint',trade:'paint',name:'塗装工事',items:['paint_scaffold','paint_net','paint_wash','paint_under','paint_middle','paint_top','paint_barge','paint_parts']},{id:'tpl_water',trade:'water',name:'水回り工事',items:['water_remove','water_toilet','water_connect']}
 ];function migrate(){if(Store.read('migrated',false))return;const oldM=(()=>{try{return JSON.parse(localStorage.getItem('itemMasters'))}catch(_){return null}})();const oldT=(()=>{try{return JSON.parse(localStorage.getItem('bundleMasters'))}catch(_){return null}})();const oldC=(()=>{try{return JSON.parse(localStorage.getItem('estimates'))}catch(_){return null}})();if(Array.isArray(oldM)&&oldM.length)Store.write('masters',oldM.map(m=>({id:m.id||id('m'),trade:m.category||'other',name:m.name||'',desc:m.desc||'',qty:1,unit:m.unit||'式',price:+m.price||0,group:m.quantityGroup||''})));if(Array.isArray(oldT)&&oldT.length)Store.write('templates',oldT.map(t=>({id:t.id||id('t'),trade:t.category||'other',name:t.name||'',items:(t.items||[]).map(x=>typeof x==='string'?x:x.masterId).filter(Boolean)})));if(Array.isArray(oldC)&&oldC.length)Store.write('cases',oldC);Store.write('migrated',true)}function init(){migrate();if(!Store.read('masters',null))Store.write('masters',defaults);if(!Store.read('templates',null))Store.write('templates',templates)}return{init,id,masters:()=>Store.read('masters',defaults),templates:()=>Store.read('templates',templates),saveMasters:v=>Store.write('masters',v),saveTemplates:v=>Store.write('templates',v)}})();
const Sync=(()=>{async function request(action,data){const url=Store.read('settings',{}).appsScriptUrl;if(!url)throw Error('Apps Script URL未設定');const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,data})});const j=await r.json();if(!j.ok)throw Error(j.error||'同期失敗');return j.data}async function pull(){const data=await request('pullMasters',{});if(data?.masters)Catalog.saveMasters(data.masters);if(data?.templates)Catalog.saveTemplates(data.templates);return data}async function push(){return request('pushMasters',{masters:Catalog.masters(),templates:Catalog.templates()})}return{pull,push}})();
const Calendar={async chooseCustomer(){return null},normalize:e=>({name:e?.name||'',address:e?.address||'',phone:e?.phone||''})};
const App=(()=>{let e;const trades={sash:['サッシ工事','箇所数'],bath:['ユニットバス工事',''],concrete:['コンクリ打設工事','施工面積'],paint:['塗装工事',''],water:['水回り工事','']};const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const clone=v=>JSON.parse(JSON.stringify(v));function fresh(){return{id:Catalog.id('draft'),trade:'',customer:{name:'',phone:'',address:'',company:''},items:[],quantities:{sashCount:1,concreteArea:60,paintArea:0,scaffoldArea:0,length:0},expense:0,note:'',updatedAt:new Date().toISOString()}}function saveDraft(){e.updatedAt=new Date().toISOString();Store.write(Store.keys.draft,e)}function start(){Catalog.init();e=Store.read(Store.keys.draft,null)||fresh();bind();render();if(Store.read('settings',{}).appsScriptUrl)Sync.pull().then(()=>render()).catch(()=>{})}function bind(){document.addEventListener('input',ev=>{if(ev.target.dataset.field){e.customer[ev.target.dataset.field]=ev.target.value;saveDraft()}if(ev.target.id==='expense'){e.expense=+ev.target.value||0;saveDraft();renderTotals()}if(ev.target.id==='note'){e.note=ev.target.value;saveDraft()}},true);window.addEventListener('beforeunload',saveDraft)}function render(){const has=!!e.trade||e.items.length>0;$('#start').classList.toggle('hide',has);$('#work').classList.toggle('hide',!has);renderTrades();if(!has)return;$('#tradeTitle').textContent=trades[e.trade]?.[0]||'見積';document.querySelectorAll('[data-field]').forEach(x=>x.value=e.customer[x.dataset.field]||'');$('#expense').value=e.expense||'';$('#note').value=e.note||'';renderQuantities();renderItems();renderTotals()}function renderTrades(){$('#tradeGrid').innerHTML=Object.entries(trades).map(([k,[n]])=>`<button class="trade" onclick="App.chooseTrade('${k}')">${n}<small>標準明細を一括追加</small></button>`).join('')}function chooseTrade(trade){const t=Catalog.templates().find(x=>x.trade===trade);if(!t)return;const masters=Catalog.masters();e.trade=trade;e.items=t.items.map(mid=>{const <script>
/* Apps Script has no CORS response headers. Read by JSONP; write with a simple POST. */
Sync.pull=()=>new Promise((resolve,reject)=>{
  const localTemplates=Catalog.templates().map(t=>JSON.parse(JSON.stringify(t)));
  const callback='mitsumoriCleanJsonp_'+Date.now();
  const url=(Store.read('settings',{}).appsScriptUrl||CLEAN_APPS_SCRIPT_URL)+'?action=pullMasters&callback='+callback;
  const script=document.createElement('script');
  const timer=setTimeout(()=>finish(new Error('Googleからの読込がタイムアウトしました')),15000);
  function finish(error,data){clearTimeout(timer);delete window[callback];script.remove();error?reject(error):resolve(data)}
  window[callback]=result=>{if(!result||!result.ok)return finish(new Error(result?.error||'読込に失敗しました'));const data=result.data||{};const masters=(Array.isArray(data.masters)?data.masters:[]).filter(m=>m&&m.id&&m.name);const ids=new Set(masters.map(m=>m.id));const templates=(Array.isArray(data.templates)?data.templates:[]).map(t=>({...t,items:(t.items||[]).filter(id=>ids.has(id))})).filter(t=>t.items.length);const localById=new Map(localTemplates.map(t=>[t.id,t]));const remoteIds=new Set(templates.map(t=>t.id));let restored=false;const merged=templates.map(t=>{const local=localById.get(t.id),startTile=!!(local?.startTile||String(local?.trade||'').startsWith('start:')||String(t.trade||'').startsWith('start:'));if(startTile!==!!t.startTile)restored=true;return {...t,startTile}});localTemplates.filter(t=>!remoteIds.has(t.id)).forEach(t=>{merged.push(t);restored=true});if(masters.length&&merged.length){Catalog.saveMasters(masters);Catalog.saveTemplates(merged);if(restored)Sync.push().catch(()=>{})}finish(null,data)};
  script.onerror=()=>finish(new Error('Googleへ接続できません'));
  script.src=url;document.head.appendChild(script);
});
Sync.push=async()=>{
  const url=Store.read('settings',{}).appsScriptUrl||CLEAN_APPS_SCRIPT_URL;
  await fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'pushMasters',data:{masters:Catalog.masters(),templates:Catalog.templates()}})});
  return {queued:true};
};
</script>

      '</style></head><body><div class="print-btn"><button class="go" onclick="window.print()">印刷 / PDF保存</button><button onclick="window.close()">閉じる</button></div>'+
      '<section class="page hyoshi"><div class="h-title-box"><div class="h-title">御　見　積　書</div></div><div class="h-top"><div style="flex:1;margin-right:12px"><div style="margin-bottom:6px"><span class="client-name">'+esc(recipient)+'</span>　御中</div><div style="font-size:12.75pt;margin-bottom:8px">下記の通り御見積もり申し上げます。</div><div class="kingaku-wrap"><div class="k-label">御見積書金額</div><div class="k-num">'+yen(totals.grand)+'.－</div><div class="k-sub">消費税含</div></div></div><div class="co-block"><div style="margin-bottom:4px">'+wareki()+'</div><div class="co-name">'+esc(issuerCompany)+'</div></div></div>'+
      '<table class="koji-tbl"><tr><td class="lbl">工　事　名</td><td colspan="3" class="koji-name-big">'+esc(construction)+'</td></tr><tr><td class="lbl">工事場所</td><td>'+esc(customer.address||'')+'</td><td class="lbl" style="width:14%">工事期間</td><td></td></tr><tr><td class="lbl">工事概要</td><td colspan="3">'+esc(construction)+'</td></tr><tr><td class="lbl">その他</td><td colspan="3" style="font-size:11.25pt;line-height:1.9">①上記工事に関しては民間（四会）連合協定工事請負契約約款に準拠します。<br>②資材・流用資材など他置き場の確保をお願いします。<br>③什器等の移動は、別途と致します。<br>④工事用電力・用水御支給願います。</td></tr><tr><td class="lbl">支払条件</td><td colspan="3">完工確認後1週間以内、または双方協議の上。</td></tr></table><div class="hosho-box">&lt;&lt;10年間メンテナンス保証工事&gt;&gt;</div>'+(estimate.note?'<div style="margin-top:8px;font-size:12pt;color:#555;border-top:1px solid #ddd;padding-top:5px">【備考】'+esc(estimate.note)+'</div>':'')+'</section>'+

<script>
/* セットを起動画面の工事として登録する。既存5工種は変更しない。 */
(function(){
  const startTrade=id=>'start:'+id;
  function templateById(id){return Catalog.templates().find(t=>t.id===id)}
  function renderStartTiles(){
    const grid=document.querySelector('#tradeGrid');
    if(!grid)return;
  const starts=Catalog.templates().filter(t=>t.startTile||String(t.trade||'').startsWith('start:'));
    const sig=starts.map(t=>t.id+'|'+t.name+'|'+t.items.length).join('~');
    if(grid.dataset.startSetSignature===sig&&starts.every(t=>grid.querySelector('[data-start-template="'+t.id+'"]')))return;
    grid.querySelectorAll('.custom-start-set').forEach(node=>node.remove());
    starts.forEach(t=>{
      const button=document.createElement('button');
      button.className='trade custom-start-set';
      button.dataset.startTemplate=t.id;
      button.type='button';
      button.innerHTML='<span>'+String(t.name||'名称未設定').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</span><small>標準明細を一括追加</small>';
      button.onclick=()=>App.chooseStartSet(t.id);
      grid.appendChild(button);
    });
    grid.dataset.startSetSignature=sig;
    const draft=Store.read('draft',{});
    const current=Catalog.templates().find(t=>t.trade===draft.trade&&t.startTile);
    if(current&&document.querySelector('#tradeTitle'))document.querySelector('#tradeTitle').textContent=current.name;
  }
  const grid=document.querySelector('#tradeGrid');
  if(grid)new MutationObserver(()=>queueMicrotask(renderStartTiles)).observe(grid,{childList:true});
  App.chooseStartSet=function(id){
    const t=templateById(id);
    if(!t)return;
    App.chooseTrade(t.trade||startTrade(id));
    const title=document.querySelector('#tradeTitle');
    if(title)title.textContent=t.name;
  };
  const priorEdit=App.editTemplate;
  App.editTemplate=function(id){
    priorEdit(id);
    const current=id?templateById(id):null;
    const trade=document.querySelector('#cleanTTrade');
    if(!trade)return;
  const checked=!!current&&(current.startTile||String(current.trade||'').startsWith('start:'));
    const token=startTrade(id||'new');
    if(checked&&!trade.querySelector('option[value="'+token+'"]')){
      const option=document.createElement('option');
      option.value=token;option.textContent='スタート画面用';
      trade.appendChild(option);trade.value=token;
    }
    const field=document.createElement('label');
    field.className='start-set-toggle';
    field.innerHTML='<input id="cleanStartSet" type="checkbox" '+(checked?'checked':'')+'> スタート画面の工事として表示';
    trade.closest('.field').insertAdjacentElement('afterend',field);
  };
  const priorCommit=App.commitCleanTemplate;
  App.commitCleanTemplate=async function(id){
    const start=!!document.querySelector('#cleanStartSet')?.checked;
    const trade=document.querySelector('#cleanTTrade');
    const token=startTrade(id);
    if(start&&trade){
      if(!trade.querySelector('option[value="'+token+'"]')){
        const option=document.createElement('option');option.value=token;option.textContent='スタート画面用';trade.appendChild(option);
      }
      trade.value=token;
    }else if(trade&&trade.value.startsWith('start:')){
      trade.value='other';
    }
    await priorCommit(id);
    const templates=Catalog.templates(),index=templates.findIndex(t=>t.id===id);
    if(index>=0){
      templates[index]={...templates[index],startTile:start};
      Catalog.saveTemplates(templates);
      try{await Sync.push()}catch(_){}
    }
    renderStartTiles();
  };
  renderStartTiles();
})();
</script>

    window[callback]=result=>{if(!result?.ok)return done(new Error(result?.error||'Googleカレンダーを読込できません'));done(null,result.data)};

    script.src=base+(base.includes('?')?'&':'?')+'action=calendarEvents&date='+encodeURIComponent(date)+'&callback='+callback;
    document.head.appendChild(script);
  });

    const customer=Store.read('draft',{}).customer||{};

<script>
/* Keep calendar day navigation in Japan time, and keep numeric fields focused while typing. */
(function(){
  const baseSetItem=App.setItem;
  const nextJstDate=(iso,delta)=>{
    const parts=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if(!parts)return '';
    const date=new Date(Date.UTC(+parts[1],+parts[2]-1,+parts[3]+delta));
    return date.toISOString().slice(0,10);
  };
  App.calendarShift=function(delta){
    const input=document.querySelector('#calendarDate');
    if(!input)return;
    input.value=nextJstDate(input.value,Number(delta)||0);
    App.calendarLoad(input.value);
  };
  const itemEditInfo=element=>{
    const source=element?.getAttribute('oninput')||'';
    const hit=source.match(/App\.setItem\((\d+),'(qty|price)'/);
    return hit?{index:+hit[1],key:hit[2]}:null;
  };
  document.addEventListener('input',event=>{
    const info=itemEditInfo(event.target);
    if(!info)return;
    event.stopImmediatePropagation();
    const draft=Store.read('draft',null),item=draft?.items?.[info.index];
    if(!item)return;
    item[info.key]=Number(event.target.value)||0;
    if(info.key==='qty')item.linked=false;
    draft.updatedAt=new Date().toISOString();
    Store.write('draft',draft);
  },true);
  document.addEventListener('blur',event=>{
    const info=itemEditInfo(event.target);
    if(info)baseSetItem(info.index,info.key,event.target.value);
  },true);
})();
</script>
<script>
/* A Sheets pull must not erase locally created sets while its previous save is arriving. */
(function(){
  const pullFromSheets=Sync.pull;
  Sync.pull=async function(){
    const localTemplates=Catalog.templates().map(template=>JSON.parse(JSON.stringify(template)));
    const data=await pullFromSheets();
    const remoteTemplates=Catalog.templates();
    const localById=new Map(localTemplates.map(template=>[template.id,template]));
    const remoteIds=new Set(remoteTemplates.map(template=>template.id));
    let restored=false;
    const merged=remoteTemplates.map(template=>{
      const local=localById.get(template.id);
      const startTile=!!(local?.startTile||String(local?.trade||'').startsWith('start:')||String(template.trade||'').startsWith('start:'));
      if(startTile!==!!template.startTile)restored=true;
      return {...template,startTile};
    });
    localTemplates.filter(template=>!remoteIds.has(template.id)).forEach(template=>{merged.push(template);restored=true});
    if(restored){Catalog.saveTemplates(merged);Sync.push().catch(()=>{});}
    return data;
  };
})();
</script>

    '日建':{name:'日建(株)',address:'〒134-0015 東京都江戸川区西瑞江4－12－3',tel:'TEL03－3656-9311'},

<script>
/* 明細のドラッグ並び替え。現在の作業中見積を先に保存してから再描画する。 */
(function(){
  let draggingIndex=null;
  const draftKey=Store.keys.draft;
  const move=(from,to)=>{
    const draft=Store.read(draftKey,null);
    if(!draft?.items||from===null||from===to||from<0||to<0||from>=draft.items.length||to>=draft.items.length)return;
    const [item]=draft.items.splice(from,1);
    draft.items.splice(to,0,item);
    draft.updatedAt=new Date().toISOString();
    Store.write(draftKey,draft);
    /* App内部の作業データも確実に読み直す。保存済み案件やマスターは変更しない。 */
    App.start();
  };
  const begin=(event,index)=>{
    draggingIndex=index;
    event.dataTransfer.effectAllowed='move';
    event.dataTransfer.setData('text/plain',String(index));
  };
  const target=(event,index)=>{
    event.preventDefault();
    const from=Number(event.dataTransfer.getData('text/plain'));
    if(Number.isInteger(from)&&from!==index)move(from,index);
    draggingIndex=null;
  };
  function attach(node,index){
    if(node.dataset.dragReady)return;
    node.dataset.dragReady='1';
    node.addEventListener('dragover',event=>{event.preventDefault();node.classList.add('drag-item-over')});
    node.addEventListener('dragleave',()=>node.classList.remove('drag-item-over'));
    node.addEventListener('drop',event=>{node.classList.remove('drag-item-over');target(event,index)});
  }
  function handle(index){
    const button=document.createElement('button');
    button.type='button';button.className='item-drag-handle';button.draggable=true;button.title='ドラッグして並べ替え';button.setAttribute('aria-label','明細を並べ替え');button.textContent='⋮⋮';
    button.addEventListener('click',event=>event.stopPropagation());
    button.addEventListener('dragstart',event=>begin(event,index));
    return button;
  }
  function enhance(){
    const head=document.querySelector('#rows')?.closest('table')?.querySelector('thead tr');
    if(head&&!head.querySelector('.drag-table-head')){const th=document.createElement('th');th.className='drag-table-head';th.textContent='';head.prepend(th)}
    document.querySelectorAll('#rows tr').forEach((row,index)=>{
      attach(row,index);
      if(!row.querySelector('.item-drag-handle')){const cell=document.createElement('td');cell.prepend(handle(index));row.prepend(cell)}
    });
    document.querySelectorAll('#cards .item-card').forEach((card,index)=>{
      attach(card,index);
      const line=card.querySelector('.item-line');
      if(line&&!line.querySelector('.item-drag-handle'))line.prepend(handle(index));
    });
  }
  new MutationObserver(enhance).observe(document.querySelector('#rows'),{childList:true});
  new MutationObserver(enhance).observe(document.querySelector('#cards'),{childList:true});
  setTimeout(enhance,0);
})();
</script>

      const name=modal.querySelector('#cleanTName')?.value.trim()||'名称未設定';
      const trade=modal.querySelector('#cleanTTrade')?.value||'other';
      const masters=Catalog.masters();

      const rows=[...modal.querySelectorAll('[data-clean-row]')].map(row=>{

      }).filter(Boolean);
      Catalog.saveMasters(masters);
      const templates=Catalog.templates(),index=templates.findIndex(template=>template.id===templateId),previous=index>=0?templates[index]:{};
      const template={...previous,id:templateId,name,trade,items:rows.map(item=>item.id),startTile:!!modal.querySelector('#cleanStartSet')?.checked};

      Catalog.saveMasters(masters);queueSync();

  };
  const oldCommitMaster=App.commitMaster;

<script>
/* 単位は「組」に統一。過去の保存データ・Sheetsから戻る旧「式」も開いた時点で直す。 */
(function(){
  const normalizeItems=items=>{let changed=false;(items||[]).forEach(item=>{if(item.unit==='式'){item.unit='組';changed=true}});return changed};
  const normalizeAll=()=>{
    let changed=false;
    const masters=Catalog.masters();if(normalizeItems(masters)){Catalog.saveMasters(masters);changed=true}
    const draft=Store.read(Store.keys.draft,null);if(draft&&normalizeItems(draft.items)){Store.write(Store.keys.draft,draft);changed=true}
    const cases=Store.read(Store.keys.cases,[]);if(cases.some(record=>normalizeItems(record.items))){Store.write(Store.keys.cases,cases);changed=true}
    return changed;
  };
  const start=App.start;
  App.start=function(){normalizeAll();return start()};
  const pull=Sync.pull;
  Sync.pull=async function(){const result=await pull();if(normalizeAll())Sync.push().catch(()=>{});return result};
  const removeOldUnit=()=>document.querySelectorAll('select').forEach(select=>{
    if(select.value==='式')select.value='組';
    select.querySelectorAll('option').forEach(option=>{if(option.value==='式'||option.textContent==='式')option.remove()});
  });
  new MutationObserver(removeOldUnit).observe(document.body,{childList:true,subtree:true});
  const oldPrint=App.print;
  App.print=function(){
    const originalOpen=window.open;
    window.open=function(){const win=originalOpen.apply(window,arguments);if(!win?.document)return win;const write=win.document.write.bind(win.document);win.document.write=html=>write(String(html).replace(/>式</g,'>組<'));return win};
    try{return oldPrint()}finally{window.open=originalOpen}
  };
  removeOldUnit();
})();

    const draft=Store.read(Store.keys.draft,null),item=draft?.items?.[info.index];
    if(!item)return;

<script>
/*
  倉庫セット編集の一本化。
  以前は「入力時の自動保存」「保存ボタン」「スタート画面用の追加処理」が
  別々に同じセットを更新していたため、保存のたびにコピーが作られる余地があった。
  以下では編集セッションごとに固定IDを一つだけ使い、同じIDを上書きする。
*/
(function(){
  const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const unitList=['組','㎡','m','個','㎥'];
  const groupList=[['','連動なし'],['sashCount','サッシ数'],['concreteArea','コンクリ面積'],['paintArea','塗装面積'],['scaffoldArea','足場面積'],['length','長さ']];
  let syncTimer;
  const queueSync=()=>{clearTimeout(syncTimer);syncTimer=setTimeout(()=>Sync.push().catch(()=>{}),700)};
  const row=(item={})=>'<div class="edit-row" data-stable-row data-master-id="'+esc(item.id||'')+'"><button class="btn sm" type="button" onclick="App.stableMoveRow(this,-1)">↑</button><input class="name" value="'+esc(item.name)+'" placeholder="品名"><input class="desc" value="'+esc(item.desc)+'" placeholder="概要"><input class="qty" type="number" inputmode="decimal" value="'+(+item.qty||0)+'"><select class="unit">'+unitList.map(unit=>'<option value="'+unit+'"'+(unit===(item.unit==='式'?'組':item.unit)?' selected':'')+'>'+unit+'</option>').join('')+'</select><input class="price" type="number" inputmode="numeric" value="'+(+item.price||0)+'"><select class="group">'+groupList.map(([key,label])=>'<option value="'+key+'"'+(key===(item.group||'')?' selected':'')+'>'+label+'</option>').join('')+'</select><button class="btn sm" type="button" onclick="App.stableMoveRow(this,1)">↓</button><button class="icon" type="button" onclick="App.stableRemoveRow(this)">×</button></div>';
  function session(){return document.querySelector('#modal .stable-template-editor')}
  function state(text){const node=session()?.querySelector('.save-state');if(node)node.textContent=text}
  function collapseExactDuplicates(){
    const seen=new Set(), unique=[];let changed=false;
    Catalog.templates().forEach(template=>{
      const key=[template.name||'',template.trade||'',(template.items||[]).join('|')].join('\u0001');
      if(seen.has(key)){changed=true;return} seen.add(key);unique.push(template);
    });
    if(changed)Catalog.saveTemplates(unique);
    return changed;
  }
  function saveEditor(push){
    const editor=session();if(!editor)return false;
    const id=editor.dataset.templateId;
    const name=editor.querySelector('#stableTName').value.trim()||'名称未設定';
    const trade=editor.querySelector('#stableTTrade').value||'other';

    const masterIndex=new Map(masters.map((master,index)=>[master.id,index]));
    const items=[];

      const itemName=element.querySelector('.name').value.trim();

      let masterId=element.dataset.masterId;

        masterId=Catalog.id('m');element.dataset.masterId=masterId;masterIndex.set(masterId,masters.length);masters.push({id:masterId});

      masters[masterIndex.get(masterId)]=master;items.push(master);
    });
    if(!items.length){state('品名を入力すると保存されます');return false}
    Catalog.saveMasters(masters);
    const templates=Catalog.templates();

  }

    document.querySelector('#modalBg').classList.add('open');
    modal.addEventListener('input',schedule,{once:false});modal.addEventListener('change',schedule,{once:false});
  };
  App.stableAddRow=function(){const rows=document.querySelector('#stableRows');rows.insertAdjacentHTML('beforeend',row({qty:1,unit:'組',price:0}));state('入力してください')};

  App.stableMoveRow=function(button,direction){const item=button.closest('[data-stable-row]'),other=direction<0?item.previousElementSibling:item.nextElementSibling;if(other)item.parentElement.insertBefore(direction<0?item:other,direction<0?other:item);saveEditor(true)};

  App.newTemplate=function(){App.editTemplate(null)};
  collapseExactDuplicates();
})();

<script>
/* 工事別施工例。選択値だけを見積データへ保存し、印刷時はQRで施工例を開ける。 */
(function(){
  const examples=[{id:'unit-bath-example',trade:'bath',title:'ユニットバス施工例',url:'https://koutaikyu.github.io/mitsumori-tool/images/unit-bath-example.png',note:'施工前から完成までの工程をご覧いただけます。'}];
  const draft=()=>Store.read(Store.keys.draft,{});
  function ensureChoice(){
    const summary=document.querySelector('.summary');if(!summary||summary.querySelector('#exampleSelect'))return;
    const block=document.createElement('div');block.className='example-choice';
    block.innerHTML='<label for="exampleSelect">施工例（印刷時にQRコードを載せる）</label><select id="exampleSelect"><option value="">載せない</option>'+examples.map(example=>'<option value="'+example.id+'">'+example.title+'</option>').join('')+'</select>';
    const before=summary.querySelector('.sumrow');summary.insertBefore(block,before||null);
    const select=block.querySelector('select');select.value=draft().exampleId||'';
    select.addEventListener('change',()=>{const data=draft();data.exampleId=select.value;data.updatedAt=new Date().toISOString();Store.write(Store.keys.draft,data)});
  }
  const refreshChoice=()=>setTimeout(ensureChoice,0);
  new MutationObserver(refreshChoice).observe(document.querySelector('#work'),{childList:true,subtree:true});refreshChoice();
  ['newEstimate','loadCase'].forEach(name=>{const base=App[name];if(!base)return;App[name]=function(){const result=base.apply(this,arguments);const select=document.querySelector('#exampleSelect');if(select)select.value=draft().exampleId||'';return result}});
  const basePrint=App.print;
  App.print=function(){
    const selected=examples.find(example=>example.id===draft().exampleId);if(!selected)return basePrint();
    const realOpen=window.open,parts=[];
    window.open=function(){return{document:{open(){},write(value){parts.push(value)},close(){}}}};
    try{basePrint()}finally{window.open=realOpen}
    let html=parts.join('');if(!html)return;
    html=html.replace('</style></head>','.example-qr{display:flex;align-items:center;gap:10px;margin-top:10px;padding:7px;border:1.5px solid #286a8f;background:#f1faff;font-size:10pt;line-height:1.45}.example-qr img{width:72px;height:72px;background:#fff}.example-qr b{display:block;font-size:12pt;color:#123b59}</style></head>');
    const qr='https://api.qrserver.com/v1/create-qr-code/?size=180x180&data='+encodeURIComponent(selected.url);
    const box='<div style="text-align:right;margin-top:8px"><img src="'+qr+'" alt="施工例QRコード" style="width:52px;height:52px;background:#fff"></div>';
    /* 合計欄の後の余白へ置く。表や合計金額には重ねない。 */
    html=html.replace('※上記金額は消費税込みの御見積金額です。</div></section>','※上記金額は消費税込みの御見積金額です。</div>'+box+'</section>');
    const win=realOpen('','_blank');if(!win){alert('印刷画面を開けませんでした。');return}win.document.open();win.document.write(html);win.document.close();
  };
})();
</script>

<script>
/* 既存の保存・同期・印刷ロジックを使ったまま、作成画面だけを日常作業向けに整える。 */
(function(){
  const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const tradeLabel=trade=>({sash:'サッシ工事',bath:'ユニットバス工事',concrete:'コンクリ打設工事',paint:'塗装工事',water:'水回り工事'})[trade]||'工事セットを選択';
  function draft(){return Store.read(Store.keys.draft,{customer:{},items:[]})}
  function rewriteHeader(){
    const top=document.querySelector('.top');if(!top||top.dataset.dailyHeader)return;
    top.dataset.dailyHeader='1';
    top.innerHTML='<span class="brand">見積ツール <small>CLEAN</small></span><div class="daily-actions"><button class="btn" onclick="App.openCases()">案件</button><button class="btn primary" onclick="App.saveCase()">保存</button><button class="btn" onclick="App.print()">PDF</button><button class="btn manage-btn" onclick="App.openManagement()">管理</button></div>';
  }
  function startFlow(){
    const start=document.querySelector('#start');if(!start||start.querySelector('.flow-start'))return;
    const box=document.createElement('div');box.className='flow-start';
    box.innerHTML='<h2>見積を作成する</h2><div class="flow-customer"><div><b>1　顧客を選ぶ</b><small id="flowCustomerName">Googleカレンダーから予定を選択</small></div><button class="btn primary" onclick="App.openCustomer()">顧客を選ぶ</button></div><p class="flow-next">2　工事セットを選ぶ　→　3　一括数量を入力　→　4　金額を確認してPDF</p>';
    start.insertBefore(box,start.firstChild);
  }
  function refreshFlow(){
    const data=draft(),customer=data.customer||{};
    const name=document.querySelector('#flowCustomerName');if(name)name.textContent=customer.name?customer.name+'　'+(customer.address||''):'Googleカレンダーから予定を選択';
    const work=document.querySelector('#work');if(!work||work.classList.contains('hide'))return;
    let bar=work.querySelector('.workflow-bar');if(!bar){bar=document.createElement('div');bar.className='workflow-bar';work.insertBefore(bar,work.firstChild)}
    bar.innerHTML='<div class="workflow-step current"><b>1 顧客</b><span>'+esc(customer.name||'未選択')+'</span><button class="btn sm" onclick="App.openCustomer()">変更</button></div><div class="workflow-step current"><b>2 工事</b><span>'+esc(customer.constructionName||tradeLabel(data.trade))+'</span><button class="btn sm" onclick="App.backToFlowStart()">変更</button></div><div class="workflow-step"><b>3 数量</b><span>一括数量・明細</span></div><div class="workflow-step"><b>4 確認</b><span>合計 → PDF</span></div>';
    document.querySelectorAll('#quantityPanel .headrow h2').forEach(node=>node.innerHTML='<span class="step-title"><span class="step-no">3</span>一括数量</span>');
    document.querySelectorAll('#work > .workspace > div > .panel .headrow h2').forEach(node=>{if(node.textContent.trim()==='明細')node.innerHTML='<span class="step-title"><span class="step-no">3</span>明細</span>'});
  }
  App.openManagement=function(){
    document.querySelector('#modal').innerHTML='<h2>管理</h2><div class="management-menu"><button class="btn" onclick="App.openWarehouse()"><b>倉庫・セット管理</b><small>単品、工事セット、マスターを編集</small></button><button class="btn" onclick="App.openSync()"><b>Google Sheets 同期</b><small>マスターとセットを同期</small></button><button class="btn" onclick="App.newEstimate()"><b>新しい見積を作る</b><small>現在の作業中見積を新規に切り替え</small></button></div><div class="modal-actions"><button class="btn" onclick="App.close()">閉じる</button></div>';
    document.querySelector('#modalBg').classList.add('open');
  };
  App.backToFlowStart=function(){
    const work=document.querySelector('#work'),start=document.querySelector('#start');if(!work||!start)return;
    work.classList.add('hide');start.classList.remove('hide');start.scrollIntoView({behavior:'smooth',block:'start'});
  };
  function decorateCards(){
    document.querySelectorAll('#cards .item-card').forEach(card=>{
      const line=card.querySelector('.item-line'),detail=card.querySelector('.detail');if(!line||!detail)return;
      if(!line.querySelector('.item-detail-toggle')){
        const button=document.createElement('button');button.type='button';button.className='item-detail-toggle';button.textContent='詳細';button.onclick=event=>{event.stopPropagation();card.classList.toggle('open')};
        line.insertBefore(button,line.querySelector('.icon'));
      }
      if(!detail.querySelector('.detail-price')){
        const source=[...line.querySelectorAll('input')].find(input=>(input.getAttribute('oninput')||'').includes("'price'"));
        if(source){const match=(source.getAttribute('oninput')||'').match(/App\.setItem\((\d+),'price'/);if(match){const field=document.createElement('div');field.className='field detail-price';field.innerHTML='<label>単価</label><input type="number" inputmode="numeric" value="'+esc(source.value)+'" oninput="App.setItem('+match[1]+',\'price\',this.value)">';detail.appendChild(field)}}
      }
    });
  }
  /* 明細の再描画だけを監視する。ここで進捗バーまで再描画すると、自身のDOM更新を
     再び監視して無限更新になるため、進捗バーは操作直後のrefreshFlowだけで更新する。 */
  const cardObserver=new MutationObserver(()=>{decorateCards()});
  function bootDaily(){
    rewriteHeader();startFlow();cardObserver.observe(document.querySelector('#work'),{childList:true,subtree:true});
    decorateCards();refreshFlow();
  }
  ['chooseTrade','loadCase','saveCustomer','applyCalendarEvent','newEstimate'].forEach(name=>{
    const base=App[name];if(!base)return;
    App[name]=function(){const result=base.apply(this,arguments);setTimeout(()=>{startFlow();decorateCards();refreshFlow()},0);return result};
  });
  const originalOpenCustomer=App.openCustomer;
  App.openCustomer=function(){const result=originalOpenCustomer.apply(this,arguments);setTimeout(()=>{const title=document.querySelector('#modal h2');if(title)title.textContent='1　Googleカレンダーから顧客を選ぶ'},0);return result};
  const originalOpenWarehouse=App.openWarehouse;
  App.openWarehouse=function(){return originalOpenWarehouse.apply(this,arguments)};
  window.addEventListener('load',bootDaily,{once:true});
  bootDaily();
})();
</script>

  function syncState(){
    const modal=document.querySelector('#modal');if(!modal)return;
    state.wall=modal.querySelector('#paintWall')?.value||state.wall;state.roof=modal.querySelector('#paintRoof')?.value||state.roof;state.mortar=modal.querySelector('#paintMortar')?.value||state.mortar;
    state.scaffold=!!modal.querySelector('#paintScaffold')?.checked;state.bioWall=!!modal.querySelector('#paintBioWall')?.checked;state.bioRoof=!!modal.querySelector('#paintBioRoof')?.checked;state.taspe=!!modal.querySelector('#paintTaspe')?.checked;
    Object.keys(PAINT_SPECS.accessories).forEach(key=>{state.accessories[key]=!!modal.querySelector('#paintAccessory_'+key)?.checked});
    state.accessories.other=!!modal.querySelector('#paintAccessory_other')?.checked;
    Object.keys(state.quantities).forEach(key=>{const value=modal.querySelector('#paintQty_'+key)?.value;if(value!==undefined)state.quantities[key]=Number(value)||0});
    state.otherName=modal.querySelector('#paintOtherName')?.value||state.otherName;
  }
  function quantityInput(key,label,unit){return '<div class="paint-quantity"><label for="paintQty_'+key+'">'+label+'</label><input id="paintQty_'+key+'" type="number" min="0" inputmode="decimal" value="'+(state.quantities[key]||'')+'"><span>'+unit+'</span></div>'}
  function renderBuilder(){
    const wallChosen=state.wall!=='none',roofChosen=state.roof!=='none',accessories=selectedAccessories();
    const accessoryChecks=Object.entries(PAINT_SPECS.accessories).map(([key,spec])=>'<label><input id="paintAccessory_'+key+'" type="checkbox" '+(state.accessories[key]?'checked':'')+' onchange="App.paintBuilderUpdate()"> '+spec.label+'</label>').join('')+'<label><input id="paintAccessory_other" type="checkbox" '+(state.accessories.other?'checked':'')+' onchange="App.paintBuilderUpdate()"> その他</label>';
    const quantities=[state.scaffold?quantityInput('scaffold','足場面積','㎡'):'',wallChosen?quantityInput('wall','外壁面積','㎡'):'',roofChosen?quantityInput('roof','屋根面積','㎡'):'',...accessories.map(key=>quantityInput(key,PAINT_SPECS.accessories[key].label,PAINT_SPECS.accessories[key].unit)),state.accessories.other?quantityInput('other','その他','組'):'' ].filter(Boolean).join('');
    document.querySelector('#modal').innerHTML='<div class="paint-builder"><h2>塗装ビルダー</h2><div class="paint-step"><h3>① 外壁素材・屋根素材</h3><div class="paint-grid"><div class="paint-choice"><label>外壁素材</label><select id="paintWall" onchange="App.paintBuilderUpdate()"><option value="none">なし</option><option value="mortar" '+(state.wall==='mortar'?'selected':'')+'>モルタル</option><option value="siding" '+(state.wall==='siding'?'selected':'')+'>窯業系サイディング</option><option value="galvanized" '+(state.wall==='galvanized'?'selected':'')+'>ガルバリウム鋼板サイディング</option><option value="tin" '+(state.wall==='tin'?'selected':'')+'>トタン</option><option value="wood" '+(state.wall==='wood'?'selected':'')+'>木部外壁</option></select></div><div class="paint-choice"><label>屋根素材</label><select id="paintRoof" onchange="App.paintBuilderUpdate()"><option value="none">なし</option><option value="colonial" '+(state.roof==='colonial'?'selected':'')+'>コロニアル／カラーベスト</option><option value="tin" '+(state.roof==='tin'?'selected':'')+'>トタン</option><option value="galvanized" '+(state.roof==='galvanized'?'selected':'')+'>ガルバリウム鋼板</option></select></div></div>'+(state.wall==='mortar'?'<div class="paint-choice" style="margin-top:8px"><label>モルタルの下地状態</label><select id="paintMortar" onchange="App.paintBuilderUpdate()"><option value="normal" '+(state.mortar==='normal'?'selected':'')+'>通常</option><option value="deteriorated" '+(state.mortar==='deteriorated'?'selected':'')+'>吸込み・劣化大</option></select></div>':'')+'</div><div class="paint-step"><h3>② 必要なオプション</h3><div class="paint-checks"><label><input id="paintScaffold" type="checkbox" '+(state.scaffold?'checked':'')+' onchange="App.paintBuilderUpdate()"> 足場を入れる</label>' +(wallChosen?'<label><input id="paintBioWall" type="checkbox" '+(state.bioWall?'checked':'')+'> 外壁：バイオ殺菌洗浄</label>':'')+(roofChosen?'<label><input id="paintBioRoof" type="checkbox" '+(state.bioRoof?'checked':'')+'> 屋根：バイオ殺菌洗浄</label>':'')+(state.roof==='colonial'?'<label><input id="paintTaspe" type="checkbox" '+(state.taspe?'checked':'')+'> 縁切り／タスペーサー</label>':'')+'</div></div><div class="paint-step"><h3>③ 付帯部（複数選択）</h3><div class="paint-checks">'+accessoryChecks+'</div>'+(state.accessories.other?'<div class="paint-choice" style="margin-top:8px"><label>その他の名称</label><input id="paintOtherName" value="'+esc(state.otherName)+'" placeholder="例：門扉塗装"></div>':'')+'</div><div class="paint-step"><h3>④ 必要数量</h3><div class="paint-quantities">'+(quantities||'<div class="paint-summary">素材・オプション・付帯部を選択すると、必要な数量欄だけ表示されます。</div>')+'</div></div><div class="paint-summary">「見積に追加」後は、通常の明細として自由に編集できます。</div><div class="modal-actions"><button class="btn" onclick="App.close()">閉じる</button><button class="btn primary" onclick="App.paintBuilderAdd()">見積に追加</button></div></div>';
    document.querySelector('#modalBg').classList.add('open');
  }
  function itemsFromBuilder(){
    const result=[],add=(entries,prefix='')=>entries.forEach(entry=>{const q=entry.quantity==='one'?1:Number(state.quantities[entry.quantity]||0);result.push({name:prefix?prefix+'｜'+entry.name:entry.name,desc:entry.desc,qty:q,unit:entry.unit,price:entry.price,group:'',linked:false})});
    if(state.scaffold)add(PAINT_SPECS.scaffold);
    if(state.wall==='mortar')add(PAINT_SPECS.walls.mortar[state.mortar]);
    else if(state.wall==='siding')add(PAINT_SPECS.walls.siding);
    else if(['galvanized','tin'].includes(state.wall))add(PAINT_SPECS.walls.metal);
    else if(state.wall==='wood')add(PAINT_SPECS.walls.wood);
    if(state.bioWall&&state.wall!=='none')add([step('バイオ殺菌洗浄','苔・藻・カビ等の殺菌処理',PAINT_PRICES.bio,'㎡','wall')]);
    if(state.roof==='colonial')add(PAINT_SPECS.roofs.colonial);
    else if(['tin','galvanized'].includes(state.roof))add(PAINT_SPECS.roofs.metal);
    if(state.bioRoof&&state.roof!=='none')add([step('バイオ殺菌洗浄','苔・藻・カビ等の殺菌処理',PAINT_PRICES.bio,'㎡','roof')]);
    if(state.taspe&&state.roof==='colonial')add([step('縁切り／タスペーサー','屋根材重なり部の排水経路確保',PAINT_PRICES.taspe,'㎡','roof')]);
    selectedAccessories().forEach(key=>add(PAINT_SPECS.accessories[key].steps,PAINT_SPECS.accessories[key].label));
    if(state.accessories.other)add([step(state.otherName||'その他','その他塗装工事',0,'組','other')]);
    return result;
  }
  function applyItems(items){
    /* 一時マスターと一時セット経由で既存の chooseTrade/render/save 流れを使う。 */
    /* 「もう一つ工事を追加」から来た場合だけ、今の通常明細を先頭に残してから塗装工程を足す。 */
    const preserved=Array.isArray(window.__appendPaintItems)?window.__appendPaintItems:[];
    window.__appendPaintItems=null;
    const originalMasters=Catalog.masters(),originalTemplates=Catalog.templates(),token='paint_builder_'+Date.now();
    const temporaryMasters=preserved.concat(items).map((item,index)=>({id:token+'_m_'+index,trade:'paint',...item}));
    const temporaryTemplate={id:token,trade:'paint',name:'塗装工事',items:temporaryMasters.map(item=>item.id)};
    Catalog.saveMasters(originalMasters.concat(temporaryMasters));Catalog.saveTemplates([temporaryTemplate].concat(originalTemplates));
    try{baseChooseTrade('paint')}finally{Catalog.saveMasters(originalMasters);Catalog.saveTemplates(originalTemplates)}
  }
  const baseChooseTrade=App.chooseTrade;
  App.chooseTrade=function(trade){if(trade==='paint'){App.openPaintBuilder();return}return baseChooseTrade.apply(this,arguments)};
  App.openPaintBuilder=function(){renderBuilder()};
  App.paintBuilderUpdate=function(){syncState();renderBuilder()};
  App.paintBuilderAdd=function(){syncState();const items=itemsFromBuilder();if(!items.length){alert('外壁・屋根・足場・付帯部のいずれかを選択してください。');return}applyItems(items);App.close()};
  window.PAINT_SPECS=PAINT_SPECS;
})();
</script>
<script>
/* A4横2ページの印刷仕上げ。画面側とデータ形式には影響させない。 */
(function(){
  const basePrint=App.print;
  App.print=function(){
    const realOpen=window.open;
    window.open=function(){
      const win=realOpen.apply(window,arguments);
      if(!win?.document)return win;
      const write=win.document.write.bind(win.document);
      win.document.write=function(source){
        let html=String(source);
        /* 明細行の数に合わせ、2枚目の表だけを用紙高へ均等に広げる。 */
        const detailRows=(html.match(/<tr(?: class="(?:blank|exp-r)")?><td/g)||[]).length;
        const rowHeight=Math.max(5,Math.min(11,150/Math.max(1,detailRows)));
        const printCss='@page{margin:5mm 6mm}' +
          /* 1枚目: 枠線・太字・金額線を抑え、読みやすく軽くする。 */
          '.hyoshi{padding:3mm 4mm}.h-title-box{border-width:2px;padding:3px 0;margin-bottom:6px}.h-title{font-size:20pt;font-weight:600;letter-spacing:.22em}.h-top{margin-bottom:6px}.client-name{font-size:16pt;font-weight:600;border-bottom-width:2px}.co-block{font-size:11pt;line-height:1.55}.co-name{font-size:13pt;font-weight:600}.kingaku-wrap{margin:3px 0;min-width:230px}.k-label{font-size:13pt}.k-num{font-size:15pt;border-bottom-width:2px;min-width:210px}.k-sub{font-size:9pt}.hosho-box{font-size:14pt;font-weight:600;margin-top:7px;padding:3px 0}.koji-tbl{margin-top:6px;font-size:11pt}.koji-tbl td{border-width:1px;padding:3px 5px}.koji-tbl .lbl{font-weight:600}.koji-name-big{font-size:14pt;font-weight:600}' +
          /* 2枚目: 余白を詰め、表を横いっぱい・縦いっぱいに使う。 */
          '.meisai{padding:1mm 2mm}.m-header{margin-bottom:3px}.m-title{font-size:16pt;border-bottom-width:2px;padding-bottom:1px}.meisai .m-tbl{font-size:10pt!important;width:100%!important}.meisai .m-tbl th{font-size:9pt!important;padding:2px 3px!important;border-width:1px}.meisai .m-tbl td{height:'+rowHeight.toFixed(2)+'mm!important;padding:1px 3px!important;border-width:1px}.meisai .m-tbl .blank td{height:'+rowHeight.toFixed(2)+'mm!important}.meisai .m-tbl tbody>tr:not(.sum-r):not(.grand-r){height:'+rowHeight.toFixed(2)+'mm}.meisai .grand-r td{font-size:13pt!important}.meisai .sum-r td{font-size:10pt!important}';
        html=html.replace('</style>',printCss+'</style>');
        return write(html);
      };
      return win;
    };
    try{return basePrint()}finally{window.open=realOpen}
  };
})();
</script>
<style>
/* 工事を追加する導線と、工種ごとに必要な数量だけを表示する。 */
.add-trade-btn{white-space:nowrap}
.additional-trades{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.additional-trades .btn{min-height:52px;text-align:left}.additional-trades small{display:block;color:var(--muted);margin-top:3px;font-weight:500}@media(max-width:760px){.additional-trades{grid-template-columns:1fr}.add-trade-btn{font-size:11px;padding:6px 8px}}
</style>
<script>
/* 塗装はビルダー内の数量だけを使う。ほかの工事の数量連動はそのまま残す。 */
(function(){
  const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const definitions={sashCount:['箇所数','組'],concreteArea:['施工面積','㎡'],paintArea:['塗装面積','㎡'],scaffoldArea:['足場面積','㎡'],length:['長さ','m']};
  const draft=()=>Store.read(Store.keys.draft,{items:[],quantities:{}});
  function syncLinkedQuantities(){
    const panel=document.querySelector('#quantityPanel'),boxes=document.querySelector('#quantityBoxes');if(!panel||!boxes)return;
    /* 塗装の面積・足場面積は旧データでも塗装ビルダー内で完結させる。
       保存済み案件の trade 値は古い名称のことがあるので、trade 値には依存しない。 */
    const data=draft(),groups=[...new Set((data.items||[]).filter(item=>item.linked&&definitions[item.group]).map(item=>item.group))]
      .filter(group=>group!=='paintArea'&&group!=='scaffoldArea');
    const signature=(data.trade||'')+'|'+groups.join('|')+'|'+groups.map(group=>data.quantities?.[group]??'').join('|');
    if(panel.dataset.linkedSignature===signature)return;
    panel.dataset.linkedSignature=signature;
    panel.classList.toggle('hide',groups.length===0);
    if(!groups.length)return;
    const title=panel.querySelector('.headrow h2');if(title)title.innerHTML='<span class="step-title"><span class="step-no">3</span>数量連動</span>';
    boxes.innerHTML=groups.map(group=>{const [label,unit]=definitions[group];return '<div class="field qbox"><label>'+label+'</label><input type="number" value="'+esc(data.quantities?.[group]??'')+'" oninput="App.applyGroup(\''+group+'\',this.value)"><span>'+unit+'</span></div>'}).join('');
  }
  function addExtraButton(){
    const head=[...document.querySelectorAll('#work .panel .headrow')].find(node=>node.querySelector('h2')?.textContent.trim().includes('明細'));if(!head||head.querySelector('.add-trade-btn'))return;
    const button=document.createElement('button');button.type='button';button.className='btn sm add-trade-btn';button.textContent='＋ もう一つ工事を追加';button.onclick=App.openAdditionalTrade;head.insertBefore(button,head.querySelector('button'));
  }
  App.openAdditionalTrade=function(){
    const entries=[['sash','サッシ工事','標準セットを追加'],['bath','ユニットバス工事','標準セットを追加'],['concrete','コンクリ打設工事','施工面積と連動'],['paint','塗装工事','塗装ビルダーを開く'],['water','水回り工事','標準セットを追加']];
    const modal=document.querySelector('#modal');modal.innerHTML='<h2>もう一つ工事を追加</h2><p class="notice">今ある明細は残したまま、追加する工事だけを足します。</p><div class="additional-trades">'+entries.map(([id,name,note])=>'<button class="btn" onclick="App.addAdditionalTrade(\''+id+'\')"><b>'+name+'</b><small>'+note+'</small></button>').join('')+'</div><div class="modal-actions"><button class="btn" onclick="App.close()">閉じる</button></div>';document.querySelector('#modalBg').classList.add('open');
  };
  App.addAdditionalTrade=function(trade){
    const before=draft().items||[];
    if(trade==='paint'){
      window.__appendPaintItems=JSON.parse(JSON.stringify(before));
      App.close();App.chooseTrade('paint');return;
    }
    const template=Catalog.templates().find(item=>item.trade===trade);
    if(!template){alert('この工事の標準セットが見つかりません。管理からセットを作成してください。');return}
    App.addTemplate(template.id);
    setTimeout(()=>{addExtraButton();syncLinkedQuantities()},0);
  };
  const observe=new MutationObserver(()=>{queueMicrotask(()=>{addExtraButton();syncLinkedQuantities()})});
  function boot(){observe.observe(document.querySelector('#work'),{childList:true,subtree:true});addExtraButton();syncLinkedQuantities()}
  ['chooseTrade','loadCase','newEstimate','paintBuilderAdd'].forEach(name=>{const base=App[name];if(!base)return;App[name]=function(){const result=base.apply(this,arguments);setTimeout(()=>{addExtraButton();syncLinkedQuantities()},0);return result}});
  boot();window.addEventListener('load',boot,{once:true});
})();
</script>
<script>App.start();</script>
